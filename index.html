<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unsprited Fusions Finder</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <script>
    // load saved theme early (no white flash)
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) { }
  </script>
  <style>
    /* fonts */
    @font-face {
      font-family: "Power Clear";
      src: url("fonts/power-clear-bold.ttf") format("truetype");
      font-weight: bold;
    }

    @font-face {
      font-family: "Power Clear Regular";
      src: url("fonts/power-clear.ttf") format("truetype");
      ascent-override: 85%;
      descent-override: 15%;
    }

    /* theme colours */
    :root {
      --bg: #fff;
      --panel: #fff;
      --text: #000;
      --muted: #999;
      --off: #e0e0e0;
      --off-hi: #ececec;
      --off-lo: #c0c0c0;
      --off-text: #686868;
      --off-hover: #404040;
      --knob: #f8f8f8;
      --page: url("img/waves-light.svg");
      --knob-lo: #b8b8b8;
      --shape-off: url("img/shapes-grey.png");
      --shape-hover: url("img/shapes-dark.png");
      --info-bg: #303030;
      --info-fg: #f8f8f8;
      --info-hover: #484848;
      color-scheme: light;
    }

    :root[data-theme="dark"] {
      --bg: #18181f;
      --panel: #262630;
      --text: #f0f0f0;
      --muted: #6c6c7c;
      --off: #34343f;
      --off-hi: #40404c;
      --off-lo: #2a2a33;
      --off-text: #8c8c9c;
      --off-hover: #d0d0dc;
      --knob: #d8d8e0;
      --page: url("img/waves-dark.svg");
      --knob-lo: #9898a8;
      --shape-off: url("img/shapes-grey-dark.png");
      --shape-hover: url("img/shapes-light.png");
      --info-bg: #d8d8e0;
      --info-fg: #262630;
      --info-hover: #f0f0f0;
      color-scheme: dark;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #18181f;
        --panel: #262630;
        --text: #f0f0f0;
        --muted: #6c6c7c;
        --off: #34343f;
        --off-hi: #40404c;
        --off-lo: #2a2a33;
        --off-text: #8c8c9c;
        --off-hover: #d0d0dc;
        --knob: #d8d8e0;
        --page: url("img/waves-dark.svg");
        --knob-lo: #9898a8;
        --shape-off: url("img/shapes-grey-dark.png");
        --shape-hover: url("img/shapes-light.png");
        --info-bg: #d8d8e0;
        --info-fg: #262630;
        --info-hover: #f0f0f0;
        color-scheme: dark;
      }
    }

    /* base */
    body {
      font-family: sans-serif;
      background: var(--page) var(--bg) fixed;
      color: var(--text);
    }

    h1,
    legend,
    button {
      font-family: "Power Clear", monospace;
      font-weight: bold;
      -webkit-font-smoothing: none;
    }

    h1 {
      font-size: 52px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 8px;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 26px;
      }
    }

    legend,
    button {
      font-size: 26px;
    }

    /* theme button */
    #top {
      position: relative;
    }

    #theme {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 45px;
      height: 45px;
      margin: 0;
      padding: 0;
      border: 0;
      cursor: pointer;
      background: #303030;
      box-shadow: inset 0 3px 0 #484848, inset 0 -3px 0 #202020;
      clip-path: polygon(3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px), 0 3px, 3px 3px);
    }

    #theme:hover {
      background: #3c3c3c;
    }

    #theme svg {
      width: 27px;
      height: 27px;
      display: block;
    }

    #theme .sun {
      display: none;
    }

    :root[data-theme="dark"] #theme .sun {
      display: block;
    }

    :root[data-theme="dark"] #theme .moon {
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) #theme .sun {
        display: block;
      }

      :root:not([data-theme="light"]) #theme .moon {
        display: none;
      }
    }

    @media (max-width: 700px) {
      #theme {
        top: 8px;
        right: 8px;
        width: 39px;
        height: 39px;
      }

      #top h1 {
        padding: 0 44px;
      }
    }

    /* hp bar + status */
    #hprow {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      width: 100%;
      max-width: 832px;
      margin: 0 auto 1em;
    }

    #status {
      margin: 0 15px 0 0;
      padding: 0 12px;
      height: 39px;
      display: flex;
      align-items: center;
      color: #68b8f8;
      background: #303030;
      border: 3px solid #000;
      border-top: 0;
      font-family: "Power Clear", monospace;
      font-weight: bold;
      font-size: 26px;
      -webkit-font-smoothing: none;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px));
    }

    #hp {
      display: flex;
      gap: 3px;
      width: 100%;
      box-sizing: border-box;
      padding: 3px;
      background: #000;
      clip-path: polygon(3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px), 0 3px, 3px 3px);
    }

    #hp[hidden] {
      display: none;
    }

    #hp .tab {
      font-family: "Power Clear", monospace;
      font-weight: bold;
      font-size: 26px;
      -webkit-font-smoothing: none;
      color: #f8d030;
      background: #303030;
      padding: 0 12px;
      display: flex;
      align-items: center;
    }

    #hp .track {
      flex: 1;
      background: #484848;
      position: relative;
      min-height: 39px;
    }

    #hp .fill {
      position: absolute;
      inset: 0;
      clip-path: inset(0 100% 0 0);
      transition: clip-path 1.2s steps(20);
      background: linear-gradient(90deg, #40b040 0 12.5%, #4db645 12.5% 25%, #59bb49 25% 37.5%, #66c14e 37.5% 50%, #72c752 50% 62.5%, #7fcd57 62.5% 75%, #8bd25b 75% 87.5%, #98d860 87.5%);
      box-shadow: inset 0 3px 0 #c0f090, inset 0 -3px 0 #309030;
    }

    /* filter toggles */
    .frow {
      margin: 21px 0;
      display: flex;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 9px 0;
    }

    .ftog {
      display: inline-flex;
      gap: 3px;
      height: 39px;
      padding: 3px;
      margin-right: .5em;
      border: 0;
      background: #000;
      cursor: pointer;
      box-sizing: border-box;
      line-height: 1;
      clip-path: polygon(3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px), 0 3px, 3px 3px);
    }

    .ftog .sw {
      position: relative;
      width: 69px;
      background: #484848;
      box-shadow: inset 0 3px 0 #383838;
    }

    .ftog .sw::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 0;
      background: #48b848;
      box-shadow: inset 0 3px 0 #c0f090, inset 0 -3px 0 #309030;
    }

    .ftog .sw::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 33px;
      height: 100%;
      background: var(--knob);
      box-shadow: inset 0 -3px 0 var(--knob-lo), 3px 0 0 #000;
    }

    .ftog .lbl {
      display: flex;
      align-items: center;
      padding: 0 11px 0 13px;
      background: var(--panel);
      color: var(--text);
    }

    .ftog.on .sw::before {
      width: 36px;
    }

    .ftog.on .sw::after {
      left: 36px;
      box-shadow: inset 0 -3px 0 var(--knob-lo), -3px 0 0 #000;
    }

    .ftog.on .lbl {
      background: #303030;
      color: #f8d030;
    }

    .ftog.mid-on .sw::before,
    .ftog.mid-off .sw::before {
      width: 18px;
    }

    .ftog.mid-on .sw::after,
    .ftog.mid-off .sw::after {
      left: 18px;
      box-shadow: inset 0 -3px 0 var(--knob-lo), 3px 0 0 #000, -3px 0 0 #000;
    }

    /* filter options */
    .fopts {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px 0;
      min-height: 39px;
    }

    .fopts[hidden] {
      display: none;
    }

    .fopts input:not([type]) {
      height: 39px;
      box-sizing: border-box;
      margin-right: 9px;
    }

    #cols .frow-att .ftog.on {
      margin-right: 0;
      clip-path: polygon(3px 0, 100% 0, 100% 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px), 0 3px, 3px 3px);
    }

    .frow-mon .fopts:not([hidden]) {
      display: contents;
    }

    /* pokémon search */
    .search {
      position: relative;
      display: flex;
      flex: 1 1 0;
      min-width: 6em;
      max-width: 14em;
    }

    .frow-mon .fopts input {
      flex: 1;
      min-width: 0;
      margin-right: 0;
      padding: 0 12px;
      border: 3px solid #000;
      border-left: 0;
      background: var(--panel);
      color: var(--text);
      outline: none;
      font-family: "Power Clear Regular", monospace;
      font-size: 26px;
      -webkit-font-smoothing: none;
      clip-path: polygon(0 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 0 100%);
    }

    .frow-mon input::placeholder {
      color: var(--muted);
    }

    .chips {
      flex-basis: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .chips:empty {
      display: none;
    }

    #cols .ftog:not(.on)~.chips {
      display: none;
    }

    /* type + colour boxes */
    .frow-type .fopts:not([hidden]) {
      flex-basis: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(117px, 1fr));
      gap: 9px;
    }

    .tbox {
      margin: 0;
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }

    .ftog,
    .chip {
      user-select: none;
      -webkit-user-select: none;
    }

    .tbox input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .tic {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 39px;
      box-sizing: border-box;
      font-family: "Power Clear", monospace;
      font-weight: bold;
      font-size: 26px;
      -webkit-font-smoothing: none;
      color: #f8f8f8;
      text-shadow: 2px 2px 0 color-mix(in srgb, var(--l) 60%, #000), 0 2px 0 color-mix(in srgb, var(--l) 60%, #000);
      background: var(--m);
      box-shadow: inset 0 3px 0 var(--h), inset 0 -3px 0 var(--l);
      clip-path: polygon(3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px), 0 3px, 3px 3px);
    }

    .tbox input:not(:checked)+.tic {
      color: var(--off-text);
      text-shadow: none;
      background: var(--off);
      box-shadow: inset 0 3px 0 var(--off-hi), inset 0 -3px 0 var(--off-lo);
    }

    .tbox:hover input:not(:checked)+.tic {
      color: var(--off-hover);
    }

    .tbox input:checked+.tic-white {
      color: #303030;
      text-shadow: 2px 2px 0 #c8c8c8;
      background: #fff;
      box-shadow: inset 0 0 0 3px #303030, inset 0 -6px 0 #b0b0b0;
    }

    /* region tiles */
    .tile {
      margin: 0;
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }

    .tile input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .tile span {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 39px;
      padding: 0 0 0 2px;
      box-sizing: border-box;
      background: var(--off);
      color: var(--off-text);
      box-shadow: inset 0 3px 0 var(--off-hi), inset 0 -3px 0 var(--off-lo);
      font-family: "Power Clear", monospace;
      font-weight: bold;
      font-size: 26px;
      -webkit-font-smoothing: none;
      clip-path: polygon(3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px), 0 3px, 3px 3px);
    }

    .tile input:checked+span {
      background: #484848;
      color: #68b8f8;
      box-shadow: inset 0 3px 0 #5c5c5c, inset 0 -3px 0 #303030;
    }

    .tile:hover input:not(:checked)+span {
      color: var(--off-hover);
    }

    /* body shapes */
    .frow-shape .fopts:not([hidden]) {
      flex-basis: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(max(66px, calc((100% - 54px) / 7)), 1fr));
      gap: 9px;
    }

    .sbox {
      margin: 0;
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }

    .sbox input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .sic {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 66px;
      color: var(--off-text);
      background: var(--off);
      box-shadow: inset 0 3px 0 var(--off-hi), inset 0 -3px 0 var(--off-lo);
      clip-path: polygon(3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px), 0 3px, 3px 3px);
    }

    .sic::before {
      content: "";
      width: 60px;
      height: 60px;
      background: var(--shape-off) 0 calc(var(--r) * -60px) / 60px 840px no-repeat;
    }

    .sbox:hover input:not(:checked)+.sic::before {
      background-image: var(--shape-hover);
    }

    .sbox input:checked+.sic::before {
      background-image: url("img/shapes-blue.png");
    }

    .sbox input:checked+.sic {
      background: #484848;
      box-shadow: inset 0 3px 0 #5c5c5c, inset 0 -3px 0 #303030;
    }

    /* info button + bubble */
    #cols .info,
    #pair .info {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 33px;
      height: 33px;
      margin: 3px 0 0;
      padding: 0;
      border: 0;
      background: var(--info-bg);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      clip-path: polygon(9px 0, 24px 0, 24px 3px, 30px 3px, 30px 9px, 33px 9px, 33px 24px, 30px 24px, 30px 30px, 24px 30px, 24px 33px, 9px 33px, 9px 30px, 3px 30px, 3px 24px, 0 24px, 0 9px, 3px 9px, 3px 3px, 9px 3px);
    }

    #cols .info::before,
    #pair .info::before {
      content: "";
      width: 6px;
      height: 21px;
      background: linear-gradient(var(--info-fg) 0 6px, transparent 6px 9px, var(--info-fg) 9px 21px);
    }

    #cols .info:hover,
    #pair .info:hover {
      background: var(--info-hover);
    }

    .info-wrap {
      position: relative;
    }

    .bubble {
      position: absolute;
      z-index: 20;
      top: -500px;
      bottom: -500px;
      left: calc(100% + 9px);
      width: 300px;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .bubble-in {
      display: block;
      position: relative;
      pointer-events: auto;
    }

    .bubble[hidden] {
      display: none;
    }

    .bubble-tail {
      position: absolute;
      top: 50%;
      left: -9px;
      width: 9px;
      height: 15px;
      margin-top: -6px;
      background: #000;
      clip-path: polygon(9px 0, 9px 15px, 6px 15px, 6px 12px, 3px 12px, 3px 9px, 0 9px, 0 6px, 3px 6px, 3px 3px, 6px 3px, 6px 0);
    }

    #pair .bubble {
      top: calc(100% + 9px);
      bottom: auto;
      left: auto;
      right: -3px;
    }

    #pair .bubble:not([hidden]) {
      display: block;
    }

    #pair .bubble-tail {
      top: -9px;
      bottom: auto;
      left: auto;
      right: 9px;
      margin: 0;
      width: 15px;
      height: 9px;
      clip-path: polygon(6px 0, 9px 0, 9px 3px, 12px 3px, 12px 6px, 15px 6px, 15px 9px, 0 9px, 0 6px, 3px 6px, 3px 3px, 6px 3px);
    }

    /* info bubbles open below on phones */
    @media (max-width: 700px) {
      #cols .bubble {
        top: calc(100% + 9px);
        bottom: auto;
        left: auto;
        right: -3px;
        width: min(300px, calc(100vw - 32px));
      }

      #cols .bubble:not([hidden]) {
        display: block;
      }

      #cols .bubble-tail {
        top: -9px;
        bottom: auto;
        left: auto;
        right: 9px;
        margin: 0;
        width: 15px;
        height: 9px;
        clip-path: polygon(6px 0, 9px 0, 9px 3px, 12px 3px, 12px 6px, 15px 6px, 15px 9px, 0 9px, 0 6px, 3px 6px, 3px 3px, 6px 3px);
      }
    }

    .bubble-box {
      display: block;
      padding: 9px 12px;
      background: var(--panel);
      color: var(--text);
      border: 3px solid #000;
      line-height: 1.15;
      font-family: "Power Clear Regular", monospace;
      font-size: 26px;
      -webkit-font-smoothing: none;
      clip-path: polygon(3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px), 0 3px, 3px 3px);
    }

    /* pair toggles */
    #pairslot {
      max-width: 1430px;
      margin: 0 auto 21px;
    }

    #pair {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px 18px;
    }

    #line {
      justify-self: end;
    }

    #pair .pair-item {
      justify-self: start;
    }

    @media (max-width: 900px) {
      #pair {
        grid-template-columns: 1fr;
        justify-items: center;
      }

      #line,
      #pair .pair-item {
        justify-self: center;
      }
    }

    #pair .ftog {
      margin: 0;
    }

    .pair-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
    }

    #toprow {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 0 auto 1.5em;
    }

    #toprow #hprow {
      margin: 0;
    }

    /* go button */
    #go {
      font-size: 52px;
      line-height: 1;
      padding: 12px 36px 15px 39px;
      border: 0;
      cursor: pointer;
      color: #f8f8f8;
      text-shadow: 4px 4px 0 #206020;
      background: #48b848;
      box-shadow: inset 0 0 0 3px #000, inset 0 9px 0 #c0f090, inset 0 -9px 0 #309030;
      clip-path: polygon(3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px), 0 3px, 3px 3px);
      user-select: none;
      -webkit-user-select: none;
    }

    #go:hover {
      background: #58c858;
    }

    #go:active {
      box-shadow: inset 0 0 0 3px #000, inset 0 9px 0 #309030, inset 0 -3px 0 #c0f090;
      padding: 15px 36px 12px 39px;
    }

    /* segmented buttons */
    .segs {
      display: flex;
      gap: 3px;
      height: 39px;
      padding: 3px 3px 3px 0;
      box-sizing: border-box;
      background: #000;
      clip-path: polygon(0 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 0 100%);
    }

    .seg {
      margin: 0;
      cursor: pointer;
      position: relative;
      user-select: none;

  <script>
    // theme switch (clears if it matches the system)
    document.getElementById("theme").onclick = () => {
      const sys = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      const next = (document.documentElement.dataset.theme || sys) === "dark" ? "light" : "dark";
      if (next === sys) delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = next;
      try { next === sys ? localStorage.removeItem("theme") : localStorage.setItem("theme", next); } catch (e) { }
    };
